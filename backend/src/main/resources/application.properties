spring.application.name=backend
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/healthcare_triage?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

ai.triage.base-url=http://localhost:8000
ai.triage.classify-path=/api/v1/triage/classify
ai.triage.connect-timeout-seconds=3
ai.triage.read-timeout-seconds=5