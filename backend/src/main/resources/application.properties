spring.application.name=backend

server.port=8080

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/triage_db
spring.datasource.username=root
spring.datasource.password=YOUR_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=this-is-a-long-secret-key-for-capstone-project-2026
app.jwt.expiration-ms=86400000

# Frontend
app.frontend.url=http://localhost:5173

# AI Triage Service
ai.triage.base-url=http://localhost:8000
ai.triage.classify-path=/api/v1/triage/classify
ai.triage.connect-timeout-seconds=3
ai.triage.read-timeout-seconds=5